name: Keep Supabase awake

# Бесплатный проект Supabase ставится на паузу после 7 дней без запросов,
# а без базы бот не работает. Health ходит в базу — раз в день хватает.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 https://bbakrtf5b9qbjortfgnq.containers.yandexcloud.net/api/v1/health
